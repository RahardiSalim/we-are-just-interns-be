name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "contracts/fixtures/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "firebase/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm install -g firebase-tools
      - run: uv sync --frozen
        working-directory: backend
      # emulators:exec sets FIRESTORE_EMULATOR_HOST etc., so the emulator tests run instead of skipping.
      - run: firebase emulators:exec --only auth,firestore --project demo-gosafe "cd ../backend && uv run pytest -q"
        working-directory: firebase

  deploy:
    needs: test
    # Skipped until the GCP repo variables exist, so pushes don't fail on a missing project.
    if: github.event_name == 'push' && vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - run: cp -r contracts/fixtures backend/fixtures
      # Repo variables to set once: GCP_PROJECT, GCP_WIF_PROVIDER, GCP_DEPLOY_SA (see contracts/ARCHITECTURE.md "On hold").
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: gosafe-api
          region: asia-southeast2
          source: backend
          flags: --memory=2Gi --min-instances=0 --no-cpu-throttling --allow-unauthenticated
          env_vars: |
            GCP_PROJECT=${{ vars.GCP_PROJECT }}
            ENABLE_DEV_ROUTES=true
